name: mazad_wanted
description: Marketplace with Auctions and Wanted requests showcasing glassmorphism UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/seed/auctions.json
    - assets/seed/wanted.json
    - assets/seed/images.json
    - assets/icons/
    - assets/illustrations/

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  iconly: ^1.0.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

